# Адрес api резолвится через DNS Docker при запросах, а не один раз при старте nginx:
# после пересоздания или масштабирования api (docker compose up --scale api=N) прокси сразу видит новые контейнеры.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    set $api http://api:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $api;
    }

    # API недоступен (контейнер перезапускается или упал) — ответ в формате ошибок API, фронт покажет текст.
    error_page 502 504 = @api_unavailable;
    location @api_unavailable {
        default_type "application/json; charset=utf-8";
        return 502 '{"error":{"code":"api_unavailable","message":"Сервис прогноза временно недоступен. Попробуйте повторить через несколько секунд."}}';
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
