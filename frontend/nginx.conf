# Адрес api перерезолвится через DNS Docker (resolve, nginx ≥ 1.27.3): после пересоздания или масштабирования api
# (docker compose up --scale api=N) прокси сам видит новые контейнеры. keepalive держит соединения к api открытыми —
# без него каждый запрос открывает новое TCP-соединение, и пропускная способность через прокси падает в разы.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 64;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Файлы до 2,5 ГБ (прогон и наборы данных): тело сразу стримится в api без буферизации на диске nginx, ответ — сразу клиенту.
    location ~ ^/api/(predict/batch|datasets|datasets/[0-9a-f]+/result)$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        client_max_body_size 2600m;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location = /health {
        proxy_pass http://api;
    }

    # API недоступен (контейнер перезапускается или упал) — ответ в формате ошибок API, фронт покажет текст.
    error_page 502 504 = @api_unavailable;
    error_page 413 = @too_large;
    location @too_large {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"file_too_large","message":"Файл слишком большой: CSV допускается до 2,5 ГБ, XLSX — до 50 МБ."}}';
    }
    location @api_unavailable {
        default_type "application/json; charset=utf-8";
        return 502 '{"error":{"code":"api_unavailable","message":"Сервис прогноза временно недоступен. Попробуйте повторить через несколько секунд."}}';
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
